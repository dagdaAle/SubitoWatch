services:
  # Service key and volume kept for compatibility with the original deployment.
  subitowatch:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    image: buywatcher:latest
    container_name: subitowatch
    ports:
      - "127.0.0.1:8081:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - subito-data:/data
    restart: unless-stopped
    stop_grace_period: 3m

volumes:
  # Do NOT rename or remove: contains historical listings and favorites.
  subito-data:
