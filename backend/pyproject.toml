[project]
name = "buywatcher"
version = "3.1.0"
description = "Radar personale dell'usato per bisogni d'acquisto, con valutazione AI degli annunci."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.12.5",
    "httpx==0.28.1",
    "curl_cffi==0.7.4",
    "Pillow==13.0.0",
    "alembic==1.16.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
